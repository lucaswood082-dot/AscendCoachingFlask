{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Contact Us</h2>
    <p>Please fill out the form below and we will get back to you as soon as possible.</p>

    <form method="POST" action="/submit_contact">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="contact">Email</label>
        <input type="email" id="contact" name="contact" placeholder="Your email" required>

        <label for="goals">Your Goals</label>
        <textarea id="goals" name="goals" placeholder="Describe your goals..." required></textarea>

        <button type="submit">Submit</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
</div>
{% endblock %}
