<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascend Coaching — Dreams without Destinations</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- PWA Manifest -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#4CAF50">

  <!-- Apple / iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">

  <!-- Optional: Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">
</head>
<body>
  <!-- Header + Navigation -->
  <header>
    <div class="container">
      <h1>Ascend Coaching</h1>
      <p>Dreams without Destinations</p>

      <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/programs">Programs</a>
        <a href="/nutrition">Nutrition Guide</a>
        <a href="/coaching">Coaching Signup</a>
        <a href="/faq">FAQ</a>
        <a href="/contact">Contact</a>
        <a href="/optimal">Optimal</a>
      </nav>
    </div>
  </header>

  <!-- Main Page Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>© 2025 Ascend Coaching. Built with Discipline.</p>
    </div>
  </footer>

  <!-- Install App Button -->
  <button id="install-btn" style="display:none;">Install App</button>

  <!-- Service Worker & Install Script -->
  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
          .then(reg => console.log('Service Worker registered', reg))
          .catch(err => console.log('Service Worker registration failed', err));
      });
    }

    // Capture beforeinstallprompt event for PWA
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block'; // show install button
      console.log('PWA install prompt saved');
    });

    // Handle Install button click
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choiceResult = await deferredPrompt.userChoice;
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
        } else {
          console.log('User dismissed the install prompt');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
