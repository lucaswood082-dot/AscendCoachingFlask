{% extends "base.html" %}

{% block content %}
<div class="calc-page">

    <!-- Title -->
    <h2 class="calc-title">Calorie & Macro Calculator</h2>
    <p class="calc-subtitle">
        Enter your details below to estimate daily calories and macros.
    </p>

    <!-- Calculator Form -->
    <form id="calcForm" class="calc-form">

        <label>Age</label>
        <input type="number" id="age" required>

        <label>Height (cm)</label>
        <input type="number" id="height" required>

        <label>Weight (kg)</label>
        <input type="number" id="weight" required>

        <label>Activity Level</label>
        <select id="activity" class="styled-select" required>
            <option value="1.2">Sedentary (little exercise)</option>
            <option value="1.375">Lightly Active (1–3 days/week)</option>
            <option value="1.55">Moderately Active (3–5 days/week)</option>
            <option value="1.725">Very Active (6–7 days/week)</option>
            <option value="1.9">Super Active (athlete)</option>
        </select>

        <button type="button" class="btn calc-btn" onclick="calculate()">
            Calculate
        </button>
    </form>

    <!-- Results Box -->
    <div id="results" class="results-box" style="display: none;">
        <h3>Your Daily Targets</h3>
        <p><strong>Calories:</strong> <span id="calories"></span></p>
        <p><strong>Protein:</strong> <span id="protein"></span> g</p>
        <p><strong>Carbs:</strong> <span id="carbs"></span> g</p>
        <p><strong>Fats:</strong> <span id="fats"></span> g</p>
    </div>

</div>

<script>
function calculate() {
    const age = parseFloat(document.getElementById("age").value);
    const height = parseFloat(document.getElementById("height").value);
    const weight = parseFloat(document.getElementById("weight").value);
    const activity = parseFloat(document.getElementById("activity").value);

    if (!age || !height || !weight) return;

    // Mifflin-St Jeor
    const bmr = 10 * weight + 6.25 * height - 5 * age + 5;
    const calories = Math.round(bmr * activity);

    // Simple macro split
    const protein = Math.round(weight * 2.2);
    const fats = Math.round((calories * 0.25) / 9);
    const carbs = Math.round((calories - (protein * 4 + fats * 9)) / 4);

    document.getElementById("calories").innerText = calories;
    document.getElementById("protein").innerText = protein;
    document.getElementById("carbs").innerText = carbs;
    document.getElementById("fats").innerText = fats;

    document.getElementById("results").style.display = "block";
}
</script>
{% endblock %}
