{% extends "base.html" %}

{% block content %}

<!-- Hero Section -->
<section class="hero">
    <h2>Calorie & Macro Calculator</h2>
    <p>Estimate your daily calories and macros based on your stats and activity level.</p>
</section>

<!-- Calculator Form -->
<section class="form-container">
    <form id="calcForm" class="form-box">
        <h3>Enter Your Details</h3>

        <label>Age</label>
        <input type="number" id="age" placeholder="Enter age" required>

        <label>Height (cm)</label>
        <input type="number" id="height" placeholder="Enter height" required>

        <label>Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter weight" required>

        <label>Gender</label>
        <select id="gender" class="styled-select" required>
            <option value="" disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Activity Level</label>
        <select id="activity" class="styled-select" required>
            <option value="" disabled selected>Select activity level</option>
            <option value="1.2">Sedentary (no exercise)</option>
            <option value="1.375">Light (1–3 days/week)</option>
            <option value="1.55">Moderate (3–5 days/week)</option>
            <option value="1.725">Intense (6–7 days/week)</option>
            <option value="1.9">Athlete (2x per day)</option>
        </select>

        <!-- Centered Calculate Button -->
        <div style="text-align:center; margin-top:20px;">
            <button type="button" class="btn" onclick="calculate()">Calculate</button>
        </div>
    </form>
</section>

<!-- Results -->
<section id="results" class="form-container" style="display:none;">
    <div class="form-box">
        <h3>Your Results</h3>
        <p id="calories"></p>
        <p id="protein"></p>
        <p id="carbs"></p>
        <p id="fats"></p>
    </div>
</section>

<!-- Styles for Selects -->
<style>
.styled-select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #1E90FF;
    background: #0f172a;
    color: white;
    font-size: 16px;
    margin-bottom: 15px;
}

.styled-select option {
    background: #0f172a;
    color: white;
}
</style>

<!-- Calculator Script -->
<script>
function calculate() {
    const age = parseInt(document.getElementById("age").value);
    const height = parseInt(document.getElementById("height").value);
    const weight = parseInt(document.getElementById("weight").value);
    const gender = document.getElementById("gender").value;
    const activity = parseFloat(document.getElementById("activity").value);

    if (!age || !height || !weight || !gender || !activity) return;

    let bmr;
    if (gender === "male") {
        bmr = 10 * weight + 6.25 * height - 5 * age + 5;
    } else {
        bmr = 10 * weight + 6.25 * height - 5 * age - 161;
    }

    const tdee = Math.round(bmr * activity);
    const protein = Math.round(weight * 2);
    const fats = Math.round((tdee * 0.25) / 9);
    const carbs = Math.round((tdee - (protein * 4 + fats * 9)) / 4);

    document.getElementById("calories").innerHTML = `<strong>Daily Calories:</strong> ${tdee} kcal`;
    document.getElementById("protein").innerHTML = `<strong>Protein:</strong> ${protein}g`;
    document.getElementById("carbs").innerHTML = `<strong>Carbs:</strong> ${carbs}g`;
    document.getElementById("fats").innerHTML = `<strong>Fats:</strong> ${fats}g`;

    document.getElementById("results").style.display = "flex";
}
</script>

{% endblock %}
